name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # LegacyProxy compiles against Nukkit-MOT's own Bedrock packet codecs (it builds every
      # modern packet with the server's classes, so the wire format can never drift). That jar
      # is not published to Maven Central, so fetch the matching tag and build it once; the
      # result is cached between runs.
      - name: Cache Nukkit-MOT jar
        uses: actions/cache@v4
        with:
          path: libs
          key: nukkit-mot-v2-1.26.50-R1

      # Keyed on the file, not on cache-hit: a cache entry can legitimately be empty, and then
      # the compile classpath would be missing every cn.nukkit class.
      - name: Ensure the Nukkit-MOT jar is present
        run: |
          set -eux
          mkdir -p libs
          if [ -f libs/Nukkit-MOT-SNAPSHOT.jar ]; then
            echo "reusing cached server jar"
            ls -l libs
            exit 0
          fi
          git clone --depth 1 --branch 1.26.50-R1 \
            https://github.com/MemoriesOfTime/Nukkit-MOT.git /tmp/nukkit-mot
          cd /tmp/nukkit-mot
          mvn -B -q package -DskipTests
          ls -lS target/*.jar
          # The shaded jar is by far the biggest one; the thin/original jar has no cn.nukkit classes.
          jar_file=$(ls -S target/*.jar | head -n 1)
          unzip -l "$jar_file" | grep -q 'cn/nukkit/network/protocol/InventoryTransactionPacket.class' \
            || { echo "::error::$jar_file is not the shaded Nukkit-MOT jar"; exit 1; }
          cp "$jar_file" "$GITHUB_WORKSPACE/libs/Nukkit-MOT-SNAPSHOT.jar"
          ls -l "$GITHUB_WORKSPACE/libs"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build LegacyProxy
        run: gradle --no-daemon build

      # The connection-encryption layer is the part that cannot be exercised without a live
      # server, so it carries its own deterministic self-test: key agreement from a synthetic
      # handshake JWT, a packet round trip, and recovery from a lost and a duplicated datagram
      # (the AES stream would otherwise desynchronise permanently).
      - name: Self-test the encryption layer
        run: java -cp build/classes/java/main:libs/Nukkit-MOT-SNAPSHOT.jar proxy.SelfTest

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: legacyproxy
          path: build/libs/*.jar
